site_name: linorobot2
site_description: Build your own autonomous ROS2 robot with Nav2, SLAM Toolbox, and robot_localization
site_url: https://linorobot.github.io/linorobot2
repo_url: https://github.com/linorobot/linorobot2
repo_name: linorobot/linorobot2

docs_dir: docs

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.footer
    - navigation.top
    - content.code.copy

nav:
  - Overview: index.md
  - System Configurations: system_configurations.md
  - Installation: installation.md
  - Base Controller: base_controller.md
  - Odometry: odometry.md
  - Setting Up Sensors: sensors.md
  - Setting Up Transforms: transforms.md
  - Mapping: mapping.md
  - Navigation: navigation.md
  - Customization Guide:
      - 1. Microcontroller Selection: customization/01_microcontroller_selection.md
      - 2. Kinematics & Motors: customization/02_kinematics_and_motors.md
      - 3. Motor Drivers: customization/03_motor_drivers.md
      - 4. Pin Assignment & Rules: customization/04_pin_assignment_rules.md
      - 5. Sensors & Actuators: customization/05_sensors_and_actuators.md
      - 6. Board Presets: customization/06_board_presets.md
      - 7. Transports & micro-ROS Agent: customization/07_transport_and_agent.md
      - 8. Step-by-Step Bringup: customization/08_step_by_step_bringup.md
  - Docker: docker.md
  - Simulation Tools: tools.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
